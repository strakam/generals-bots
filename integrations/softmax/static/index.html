<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Generals</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" data-local="board.css">
  <link rel="stylesheet" data-local="style.css">
</head>
<body>
  <main>
    <header><a class="brand" href="https://generals.bot" target="_blank" rel="noreferrer">GENERALS<span id="variant-title">CLASSIC 1v1</span></a><span id="mode" class="badge">CONNECTING</span></header>
    <section class="matchbar">
      <div class="player red"><span class="dot"></span><div><b id="name0">Player 1</b><small><span id="army0">—</span> army <span class="divider">/</span> <span id="land0">—</span> land</small></div></div>
      <div class="clock"><b id="turn">0</b><small id="turn-label">TURN</small></div>
      <div class="player blue"><div><b id="name1">Player 2</b><small><span id="army1">—</span> army <span class="divider">/</span> <span id="land1">—</span> land</small></div><span class="dot"></span></div>
    </section>
    <section class="arena" aria-label="Game board">
      <div id="board" tabindex="0" aria-label="Select an owned tile, then use arrow keys to queue moves. E undoes one move; Q clears the queue."></div>
      <div id="cover"><h1 id="cover-title">Preparing the battlefield</h1><p id="cover-text">Waiting for the match to begin.</p></div>
    </section>
    <div id="status" role="status" aria-live="polite">Connecting…</div>
    <section id="play-controls" class="controls" hidden>
      <button id="split" aria-pressed="false">Half army <kbd>H</kbd></button>
      <button id="pass">Pass</button>
      <button id="deselect">Deselect <kbd>Space</kbd></button>
      <button id="undo">Undo last <kbd>E</kbd></button>
      <button id="clear">Clear queue <kbd>Q</kbd></button>
      <span id="queue-count">0 queued</span>
      <span id="build-hint" hidden></span>
      <span class="hint">Select your tile · Arrow keys or WASD to queue moves</span>
    </section>
    <section id="replay-controls" class="controls" hidden>
      <button id="pause">Pause</button><button id="restart" aria-label="Restart replay">↺</button>
      <input id="seek" type="range" min="0" max="1" value="0" aria-label="Replay turn">
      <select id="speed" aria-label="Playback speed"><option value="2">½×</option><option value="4" selected>1×</option><option value="8">2×</option><option value="20">5×</option><option value="60">15×</option></select>
    </section>
    <footer><span>Capture the general. Hold your ground.</span><span id="endgame">Capture castles to grow your army</span></footer>
  </main>
  <script>
    // Live pages may be nested beneath a platform proxy. Static bundles use
    // sibling assets; hosted play forwards game assets under /client/.
    const prefix = location.pathname.includes('/client/') ? location.pathname.split('/client/')[0] + '/client/static/' : './';
    document.querySelectorAll('link[data-local]').forEach(link => link.href = prefix + link.dataset.local);
    const rendererScript = document.createElement('script'); rendererScript.src = prefix + 'board.js';
    rendererScript.onload = () => {
      const script = document.createElement('script'); script.src = prefix + 'app.js'; document.body.appendChild(script);
    };
    document.body.appendChild(rendererScript);
  </script>
</body>
</html>
